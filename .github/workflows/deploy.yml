name: Deploy ShopHub

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the page is not suspiciously small
        run: |
          SIZE=$(wc -c < site/index.html)
          echo "index.html is $SIZE bytes"
          test "$SIZE" -ge 200

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the VM
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VM_USER@$HOST"
